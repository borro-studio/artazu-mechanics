<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Creative Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Helvetica vía sistema, sin Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { syne: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'] },
          colors: {
            dark: '#1a1a1a',
            'dark-2': '#2b2b2b',
            light: '#ededed',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --tp-ff: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --tp-dark: #1a1a1a;
      --tp-light: #ededed;
      --tp-white: #ffffff;
      --tp-gray: #4a4a4a;
      --tp-bg: #ededed;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      font-family: var(--tp-ff);
      background: var(--tp-bg);
      color: var(--tp-dark);
      overflow-x: hidden;
      cursor: none;
    }

    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; }

    /* ─── CURSOR ─── */
    #magic-cursor { position: fixed; inset: 0; pointer-events: none; z-index: 99999; }
    #ball {
      position: fixed;
      width: 14px; height: 14px;
      background: var(--tp-dark);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.3s, height 0.3s, border-radius 0.3s;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    body.cursor-hover #ball { width: 60px; height: 60px; }
    body.menu-open #ball { background: #ee7419; mix-blend-mode: normal; }

    /* ─── BACK TO TOP ─── */
    .back-to-top-wrapper {
      position: fixed; bottom: 30px; right: 30px; z-index: 100;
      opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .back-to-top-wrapper.show { opacity: 1; visibility: visible; }
    .back-to-top-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--tp-light); color: var(--tp-dark);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.3s;
    }
    .back-to-top-btn:hover { background: var(--tp-dark); color: var(--tp-light); }

    /* ─── OFFCANVAS ─── */
    .tp-offcanvas-2-area {
      position: fixed; inset: 0; z-index: 9998;
      pointer-events: none;
    }
    .tp-offcanvas-2-area.open { pointer-events: all; }
    .tp-offcanvas-2-bg {
      position: absolute; top: 0; bottom: 0;
      width: 50%; background: var(--tp-dark);
      transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.76,0,0.24,1);
    }
    .tp-offcanvas-2-bg.is-right { left: 50%; transform: translateX(100%); }
    .tp-offcanvas-2-area.open .tp-offcanvas-2-bg { transform: translateX(0); }
    .tp-offcanvas-2-wrapper {
      position: absolute; inset: 0;
      display: flex;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s 0.4s;
    }
    .tp-offcanvas-2-area.open .tp-offcanvas-2-wrapper { opacity: 1; visibility: visible; }
    .tp-offcanvas-2-left {
      width: 50%; padding: 35px 0 35px 90px;
      display: flex; flex-direction: column; justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .tp-offcanvas-2-right { width: 50%; padding: 30px 90px 35px 90px; }
    .tp-offcanvas-2-close-btn {
      background: none; border: none; cursor: pointer; color: var(--tp-light);
    }
    .tp-offcanvas-menu { margin-top: 0; text-align: left; }
    .tp-offcanvas-menu > a,
    .tp-offcanvas-menu-item {
      display: block;
      border-bottom: none;
    }
    .tp-offcanvas-menu > a {
      font-size: 72px; font-weight: 700; color: var(--tp-light);
      line-height: 1; padding: 14px 0;
      transition: opacity 0.3s;
    }
    .tp-offcanvas-menu > a:hover { opacity: 0.5; }
    .tp-offcanvas-menu-toggle {
      display: flex; align-items: center; justify-content: flex-start; gap: 20px;
      width: 100%; background: none; border: none; cursor: pointer;
      font-size: 72px; font-weight: 700; color: var(--tp-light);
      font-family: var(--tp-ff);
      line-height: 1; padding: 14px 0;
      transition: opacity 0.3s;
      text-align: left;
    }
    .tp-offcanvas-menu-toggle:hover { opacity: 0.5; }
    .tp-sub-arrow {
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      flex-shrink: 0;
    }
    .tp-offcanvas-menu-item.open .tp-sub-arrow { transform: rotate(180deg); }
    .tp-offcanvas-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
      opacity: 0;
    }
    .tp-offcanvas-menu-item.open .tp-offcanvas-submenu {
      max-height: 200px;
      opacity: 1;
    }
    .tp-offcanvas-submenu a {
      display: block;
      font-size: 20px; font-weight: 400; color: rgba(255,255,255,0.5);
      padding: 10px 0;
      border-bottom: none;
      transition: color 0.2s;
    }
    .tp-offcanvas-submenu a:last-child { padding-bottom: 20px; }
    .tp-offcanvas-submenu a:hover { color: #ee7419; opacity: 1; }

    /* ─── HEADER ─── */
    #header-sticky {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 35px 0;
      transition: padding 0.3s, background 0.3s, box-shadow 0.3s;
    }
    #header-sticky.header-sticky {
      position: fixed;
      padding: 18px 0;
      background: var(--tp-bg);
      box-shadow: 0 2px 30px rgba(0,0,0,0.08);
    }
    .tp-header-main-sticky { width: 100%; }
    .container-1760 { max-width: 1790px; margin: 0 auto; padding: 0 40px; }
    .tp-header-1-logo img { height: 36px; width: auto; }
    .tp-header-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .tp-header-linkedin {
      display: flex;
      align-items: center;
    }
    .tp-header-linkedin a { color: var(--tp-dark); opacity: 0.7; transition: opacity 0.2s; }
    .tp-header-linkedin a:hover { opacity: 1; }
    .tp-header-1-logo { text-align: center; }
    .tp-header-right { display: flex; align-items: center; justify-content: flex-end; }
    .tp-hamburger-btn {
      background: none; border: none; cursor: pointer; padding: 4px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .tp-hamburger-btn span {
      display: block; width: 28px; height: 1.5px; background: var(--tp-dark);
      transition: 0.3s;
    }

    /* ─── SECTION TITLE ─── */
    .tp-section-title {
      font-size: 100px;
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: -6px;
      font-family: var(--tp-ff);
      color: var(--tp-dark);
      margin-bottom: 20px;
    }
    .tp-section-title.white { color: var(--tp-light); }

    /* ─── HERO ─── */
    .tp-hero-area {
      background: var(--tp-bg);
      position: relative;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Headline top-left */
    .tp-hero-left {
      position: absolute;
      top: 50%; left: 40px;
      transform: translateY(-40%);
      z-index: 2;
      max-width: none;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .tp-hero-headline h1 {
      font-size: clamp(64px, 8vw, 124px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -3px;
      color: var(--tp-dark);
      white-space: nowrap;
      hyphens: none;
    }
    .tp-hero-tagline-inner {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .tp-hero-isotipo {
      width: 40px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* Logo watermark */
    .tp-hero-logo-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
    }
    .tp-hero-logo-bg svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .tp-hero-tagline-mobile { display: none; }
    .tp-hero-tagline p {
      font-size: 20px;
      line-height: 1.6;
      color: rgba(26,26,26,0.55);
      max-width: 340px;
    }

    /* Scroll indicator bottom-left */
    .tp-hero-down {
      position: absolute;
      bottom: 40px; left: 40px;
      z-index: 2;
    }
    .tp-hero-down a {
      display: flex; align-items: center; gap: 10px;
      color: var(--tp-dark);
    }
    .tp-hero-down-text span {
      font-size: 12px; font-weight: 400; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--tp-dark);
    }

    /* Forma angular naranja */
    .tp-hero-shape {
      position: absolute;
      top: 50%; right: calc(4vw + 22vw - 14vw);
      transform: translateY(-50%) rotate(-18deg);
      z-index: 2;
      width: 28vw;
      max-width: 380px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    .tp-hero-shape svg { width: 100%; height: auto; display: block; }

    /* Central image */
    .tp-hero-center-img {
      position: absolute;
      top: 50%; right: 4vw;
      transform: translateY(-50%);
      z-index: 1;
      width: 44vw;
      max-width: 700px;
    }
    .tp-hero-center-img img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    /* ─── BUTTONS ─── */
    .tp-btn {
      position: relative; overflow: hidden;
      font-weight: 500; font-size: 20px;
      border-radius: 100px; display: inline-flex;
      align-items: center; gap: 12px;
      padding: 27px 66px;
      letter-spacing: -0.16px; text-transform: capitalize;
      z-index: 1;
      background: transparent;
      color: var(--tp-dark);
      font-family: var(--tp-ff);
      border: 1px solid var(--tp-dark);
      transition: color 500ms ease;
    }
    .tp-btn.white-border {
      color: var(--tp-light);
      border-color: rgba(245,247,245,0.3);
    }
    .tp-btn.button-style-2::after {
      content: ''; position: absolute;
      left: 0; bottom: 0;
      height: 0; width: 100%; z-index: -1;
      background: var(--tp-dark);
      transition: all 0.4s cubic-bezier(0.215,0.61,0.355,1);
    }
    .tp-btn.button-style-2.white-fill::after { background: var(--tp-light); }
    .tp-btn.button-style-2:hover { color: var(--tp-light); }
    .tp-btn.button-style-2.white-fill:hover { color: var(--tp-dark); }
    .tp-btn.button-style-2:hover::after { top: 0; bottom: auto; height: 100%; }

    /* ─── PORTFOLIO ─── */
    .tp-project-ptb { background: var(--tp-dark); padding-top: 150px; padding-bottom: 40px; }
    .tp-project-heading { margin-bottom: 70px; }
    .tp-project-btn { margin-bottom: 70px; }
    .tp-project-item { margin-bottom: 120px; }
    .tp-project-item:hover .tp-project-item-thumb img { transform: scale(1.1); }
    .tp-project-item:hover .tp-project-item-thumb::before { opacity: 1; visibility: visible; }
    .tp-project-item-thumb {
      width: 100%; height: 470px; overflow: hidden; position: relative;
    }
    .tp-project-item-thumb::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(18,18,18,0.75);
      opacity: 0; visibility: hidden; z-index: 1;
      transition: 0.3s ease-out;
    }
    .tp-project-item-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.9s ease;
    }
    .tp-project-item-content {
      margin-top: 40px; padding-top: 30px;
      border-top: 0.5px solid rgba(255,255,255,0.15);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .tp-project-item-title {
      font-size: 50px; font-weight: 700;
      color: var(--tp-light); line-height: 1;
      letter-spacing: -1px;
    }
    .tp-project-item-title a {
      background-image: linear-gradient(#ededed,#ededed), linear-gradient(#ededed,#ededed);
      background-size: 0% 1px, 0 1px;
      background-position: 100% 100%, 0 100%;
      background-repeat: no-repeat;
      transition: background-size 0.3s linear;
    }
    .tp-project-item-title a:hover { background-size: 0% 1px, 100% 1px; }
    .tp-project-item-content-left p {
      font-size: 18px; line-height: 1.5; font-weight: 500; color: rgba(237,237,237,0.65);
      margin-top: 12px;
    }

    /* ─── MAQUINARIA ─── */
    .tp-maquinaria-ptb {
      background: var(--tp-bg);
      padding: 120px 0;
    }
    .tp-maquinaria-header {
      margin-bottom: 80px;
    }
    .tp-maquinaria-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ee7419;
      margin-bottom: 16px;
    }
    .tp-maquinaria-title {
      font-size: 90px;
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: -5px;
      color: var(--tp-dark);
    }
    .tp-maquinaria-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 60px;
    }
    .tp-maquinaria-item {
      border-top: 0.5px solid rgba(0,0,0,0.12);
      padding-top: 40px;
      position: relative;
      overflow: visible;
    }
    .tp-maquinaria-img {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 320px;
      margin-bottom: 32px;
    }
    .tp-maquinaria-img img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .tp-maquinaria-name {
      font-size: 22px;
      font-weight: 600;
      color: #ee7419;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .tp-maquinaria-specs {
      display: flex;
      gap: 0;
      border-top: 0.5px solid rgba(0,0,0,0.12);
    }
    .tp-spec-col {
      flex: 1;
      min-width: 0;
      padding: 20px 16px;
      border-right: 0.5px solid rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tp-spec-col:last-child { border-right: none; }
    .tp-spec-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(26,26,26,0.4);
      line-height: 1.3;
    }
    .tp-spec-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--tp-dark);
      line-height: 1.3;
      word-break: break-word;
    }
    @media (max-width: 767px) {
      .tp-maquinaria-ptb { padding: 60px 0 80px; }
      .tp-maquinaria-header { text-align: center; margin-bottom: 40px; }
      .tp-maquinaria-title { font-size: 48px; letter-spacing: -2px; }
      .tp-maquinaria-grid { grid-template-columns: 1fr; gap: 48px 0; max-width: 320px; margin-left: auto; margin-right: auto; }
      .tp-maquinaria-item { padding: 20px 16px 16px; border-top: none; overflow: hidden; }
      .tp-maquinaria-img { height: 220px; align-items: center; margin-bottom: 16px; }
      .tp-maquinaria-img img { max-height: 200px; max-width: 100%; }
      .tp-maquinaria-name { font-size: 16px; margin-bottom: 12px; text-align: center; }
      .tp-maquinaria-specs { display: grid; grid-template-columns: 1fr 1fr; border-top: 0.5px solid rgba(0,0,0,0.12); }
      .tp-spec-col { flex: unset; min-width: unset; padding: 14px 12px; text-align: center; border-right: 0.5px solid rgba(0,0,0,0.12); border-bottom: 0.5px solid rgba(0,0,0,0.12); }
      .tp-spec-col:nth-child(even) { border-right: none; }
      .tp-spec-col:nth-child(3), .tp-spec-col:nth-child(4) { border-bottom: none; }
      .tp-spec-col:nth-child(5) { grid-column: 1 / -1; border-right: none; border-bottom: none; }
      .tp-spec-value { font-size: 14px; }
      .tp-spec-label { font-size: 10px; }
    }

    /* ─── ABOUT ─── */
    /* ── CONTACTO ── */
    .tp-contact-ptb {
      background: var(--tp-dark);
      padding: 120px 40px;
    }
    .tp-contact-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .tp-contact-label {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ee7419;
      margin-bottom: 24px;
    }
    .tp-contact-title {
      font-size: clamp(48px, 5vw, 80px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--tp-light);
      margin-bottom: 60px;
    }
    .tp-contact-info {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .tp-contact-link {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-decoration: none;
      color: var(--tp-light);
      transition: opacity 0.2s;
    }
    a.tp-contact-link:hover { opacity: 0.6; }
    .tp-contact-info-label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    .tp-contact-link span:last-child {
      font-size: 18px;
    }
    .tp-contact-form {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .tp-contact-field {
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .tp-contact-field input,
    .tp-contact-field textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--tp-light);
      font-family: var(--tp-ff);
      font-size: 17px;
      padding: 22px 0;
      resize: none;
    }
    .tp-contact-field input::placeholder,
    .tp-contact-field textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .tp-contact-btn {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #ee7419;
      color: #fff;
      border: none;
      font-family: var(--tp-ff);
      font-size: 16px;
      font-weight: 500;
      padding: 18px 36px;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-start;
    }
    .tp-contact-btn:hover { background: #d4661a; }

    .tp-about-ptb { background: var(--tp-dark); padding-top: 100px; padding-bottom: 150px; }
    .tp-about-heading { margin-bottom: 80px; }
    .tp-about-box { padding-bottom: 180px; }
    .tp-about-thumb img { width: 100%; border-radius: 2px; }
    @keyframes tpupdown { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
    .tp-about-thumb { animation: tpupdown 2s infinite alternate ease-in-out; }
    .tp-about-text-1 {
      font-size: 22px; margin-bottom: 30px;
      color: var(--tp-light); line-height: 1.6;
    }
    .tp-about-text-2 {
      font-size: 18px; line-height: 1.6;
      color: var(--tp-light); margin-bottom: 55px;
    }
    .tp-about-btn .tp-btn {
      color: var(--tp-light);
      border-color: rgba(234,234,235,0.4);
    }
    .tp-about-btn .tp-btn.button-style-2::after { background: var(--tp-light); }
    .tp-about-btn .tp-btn.button-style-2:hover { color: var(--tp-dark); }
    .tp-about-wrap img { width: 100%; height: 700px; object-fit: cover; }

    /* ─── ENGINEERING SECTION ─── */
    .tp-eng-section { background: var(--tp-bg); padding: 100px 0 80px; }
    .tp-eng-row { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .tp-eng-title-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .tp-eng-word {
      display: block;
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -4px;
      color: var(--tp-dark);
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .tp-eng-amp {
      position: absolute;
      top: 50%;
      left: -20px;
      transform: translateY(-50%);
      font-size: 320px;
      font-weight: 800;
      letter-spacing: -14px;
      color: #C97A35;
      opacity: 0.5;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    .tp-eng-list { list-style: none; border-top: 1px solid rgba(0,0,0,0.12); }
    .tp-eng-list li {
      font-size: 18px;
      font-weight: 400;
      color: var(--tp-dark);
      padding: 22px 0;
      border-bottom: 1px solid rgba(0,0,0,0.12);
      line-height: 1.4;
    }
    @media (max-width: 991px) {
      .tp-eng-row { grid-template-columns: 1fr !important; gap: 50px; }
      .tp-eng-word { font-size: 72px; letter-spacing: -3px; }
      .tp-eng-amp { font-size: 240px; letter-spacing: -10px; }
    }
    @media (max-width: 767px) {
      .tp-eng-section { padding: 60px 0; }

  <script>
    const ball = document.getElementById('ball');
    let mx=0,my=0,bx=0,by=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    (function animCursor(){bx+=(mx-bx)*.12;by+=(my-by)*.12;ball.style.left=bx+'px';ball.style.top=by+'px';requestAnimationFrame(animCursor);})();
    document.querySelectorAll('a,button').forEach(el=>{
      el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));
    });
    const header=document.getElementById('header-sticky');
    window.addEventListener('scroll',()=>{
      header.classList.toggle('header-sticky',window.scrollY>80);
      document.getElementById('backToTop').classList.toggle('show',window.scrollY>400);
    });
    function openOffcanvas(){document.getElementById('offcanvasArea').classList.add('open');document.body.style.overflow='hidden';document.body.classList.add('menu-open');}
    function closeOffcanvas(){document.getElementById('offcanvasArea').classList.remove('open');document.body.style.overflow='';document.body.classList.remove('menu-open');}
    function toggleSubmenu(btn){btn.closest('.tp-offcanvas-menu-item').classList.toggle('open');}

    // Salida: fade a negro, luego navega
    document.querySelectorAll('a.tp-nav-link').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (!href || href.startsWith('#')) return;
        e.preventDefault();
        const overlay = document.getElementById('page-transition-overlay');
        overlay.style.pointerEvents = 'all';
        overlay.style.opacity = '1';
        setTimeout(() => { window.location.href = href; }, 420);
      });
    });
  </script>
